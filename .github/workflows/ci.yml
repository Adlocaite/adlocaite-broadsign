name: CI

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  branch-policy:
    name: Branch Policy
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce source branch
        env:
          # Via env, not inline: the branch name is attacker-controlled
          # (fork PRs), and ${{ }} is expanded into the script text before
          # the shell parses it.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "PR source branch: $HEAD_REF"
          echo "PR target branch: main"

          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::PRs to main must come from dev branch. Got: $HEAD_REF"
            echo ""
            echo "Follow the correct Git flow: feature/* → dev → main"
            echo "Direct feature branch PRs to main are not allowed."
            exit 1
          fi

          echo "Source branch is dev — OK"

  deploy-token-check:
    name: Deploy Token Check
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate DEPLOY_PAT
        id: check
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          if [ -z "$DEPLOY_PAT" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $DEPLOY_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "status=valid" >> "$GITHUB_OUTPUT"
          else
            echo "status=expired" >> "$GITHUB_OUTPUT"
            echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Post warning comment
        if: steps.check.outputs.status != 'valid'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TOKEN_STATUS: ${{ steps.check.outputs.status }}
          HTTP_CODE: ${{ steps.check.outputs.http_code }}
        with:
          script: |
            const status = process.env.TOKEN_STATUS;
            const httpCode = process.env.HTTP_CODE;

            const statusMsg = status === 'missing'
              ? '`DEPLOY_PAT` secret is **not set**.'
              : `\`DEPLOY_PAT\` is **expired or invalid** (HTTP ${httpCode}).`;

            const body = [
              `## Deploy Token Check: FAILED`,
              ``,
              `${statusMsg}`,
              `Without a valid token, the **version bump after merging to main will fail**.`,
              ``,
              `### How to fix`,
              ``,
              `**1. Create a Fine-grained PAT:**`,
              `- Go to **GitHub > Settings > Developer Settings > Personal Access Tokens > Fine-grained tokens**`,
              `- **Token name:** \`deploy-version-bump-adlocaite-broadsign\``,
              `- **Expiration:** 90 days (set a calendar reminder!)`,
              `- **Resource owner:** \`Adlocaite\``,
              `- **Repository access:** "Only select repositories" > \`adlocaite-broadsign\``,
              `- **Permissions:** Contents: Read and Write`,
              `- Click **Generate token** and copy it`,
              ``,
              `**2. Add/update the repo secret:**`,
              `- Go to [Repository Secrets](https://github.com/${context.repo.owner}/${context.repo.repo}/settings/secrets/actions)`,
              `- Create or update secret **\`DEPLOY_PAT\`** with the new token`,
              ``,
              `---`,
              `<!-- DEPLOY_TOKEN_CHECK_COMMENT -->`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body && c.body.includes('<!-- DEPLOY_TOKEN_CHECK_COMMENT -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Fail if token invalid
        if: steps.check.outputs.status != 'valid'
        run: |
          echo "::error::DEPLOY_PAT is ${{ steps.check.outputs.status }}. Version bump will fail on merge to main."
          exit 1

  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare build environment
        run: |
          cp package/js/config.example.js package/js/config.js
          sed -i "s/apiKey: 'pub_xxxx'/apiKey: 'pub_CI_BUILD'/" package/js/config.js

      - name: Build package
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify package
        run: |
          if [ ! -f "adlocaite-broadsign.x-html-package" ]; then
            echo "ERROR: Package file not found"
            exit 1
          fi

          # Verify it's a valid zip
          unzip -t adlocaite-broadsign.x-html-package

          # Verify required files are in the package: the modules test.sh
          # requires (everything index.html loads) plus the generated
          # config.js and version.js. Exact path match, not substring.
          FILES="$RUNNER_TEMP/package-files.txt"
          unzip -Z1 adlocaite-broadsign.x-html-package > "$FILES"
          for f in \
            index.html \
            css/styles.css \
            js/version.js \
            js/config.js \
            js/logger.js \
            js/adlocaite-api.js \
            js/broadsign-adapter.js \
            js/vast-parser.js \
            js/player.js; do
            grep -qxF "$f" "$FILES" || { echo "ERROR: $f missing"; exit 1; }
          done

          echo "All required files present in package:"
          cat "$FILES"
